[workspace]
members = ["apps/seamless-input", "crates/protocol", "crates/core", "crates/discovery", "crates/transport", "crates/platform-macos"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
ratatui = "0.29"
rmp-serde = "1.3"
serde_bytes = "0.11"
proptest = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt", "sync", "time", "test-util"] }
crc32fast = "1"
