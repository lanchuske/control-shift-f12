[package]
name = "seamless-input"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[package.metadata.winresource]
ProductName = "Control Shift F12"
FileDescription = "Control Shift F12"
OriginalFilename = "seamless-input.exe"

[features]
pairing-v2-experimental = ["seamless-discovery/pairing-v2-experimental", "seamless-transport/pairing-v2-experimental", "dep:mdns-sd", "dep:rustls"]

[dependencies]
clap.workspace = true
ratatui.workspace = true
crossterm.workspace = true
rand.workspace = true
serde.workspace = true
serde_json = "1"
rmp-serde.workspace = true
toml.workspace = true
seamless-input-core = { path = "../../crates/core" }
seamless-input-protocol = { path = "../../crates/protocol" }
seamless-discovery = { path = "../../crates/discovery" }
seamless-transport = { path = "../../crates/transport" }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
tokio.workspace = true
thiserror = "2"
mdns-sd = { version = "0.21", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
seamless-input-platform-macos = { path = "../../crates/platform-macos" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }
seamless-input-platform-windows = { path = "../../crates/platform-windows" }

[dev-dependencies]
insta = "1.42"
tempfile = "3.14"
rcgen = "0.14"

[build-dependencies]
winresource = "0.1.34"

[[bin]]
name = "seamless-input"
path = "src/main.rs"
