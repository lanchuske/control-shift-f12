[advisories]
version = 2
yanked = "deny"
# ratatui 0.29 depends on paste 1.0.15. The advisory records that the
# proc-macro is unmaintained; it does not report a vulnerability and offers no
# safe upgrade. Keep the exception explicit until ratatui removes the crate.
ignore = ["RUSTSEC-2024-0436"]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
